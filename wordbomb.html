<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBomb Chain Multiplayer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0D0D1A', surface: '#131328', surfaceElevated: '#1C1C3A',
                        primary: '#FF4D00', secondary: '#FFB800',
                        success: '#00E5A0', danger: '#FF2D55',
                        textMain: '#F0F0FF', textMuted: '#7070A0'
                    },
                    fontFamily: {
                        display: ['Rajdhani', 'sans-serif'], body: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace']
                    },
                    boxShadow: {
                        'neon-primary': '0 0 15px rgba(255, 77, 0, 0.6)',
                        'neon-success': '0 0 15px rgba(0, 229, 160, 0.6)',
                        'neon-danger': '0 0 20px rgba(255, 45, 85, 0.8)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0D0D1A;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            animation: backgroundDrift 100s linear infinite;
        }
        /* Animasi Textbox Salah (Merah & Bergetar) */
        .input-error {
            animation: shakeError 0.4s ease-in-out;
            border-color: #FF2D55 !important;
            color: #FF2D55 !important;
            box-shadow: 0 0 15px rgba(255, 45, 85, 0.4), inset 0 0 10px rgba(255, 45, 85, 0.2) !important;
        }
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Animasi Textbox Benar (Hijau & Membesar Sedikit) */
        .input-success {
            animation: pulseSuccess 0.4s ease-out;
            border-color: #00E5A0 !important;
            color: #00E5A0 !important;
            box-shadow: 0 0 15px rgba(0, 229, 160, 0.4), inset 0 0 10px rgba(0, 229, 160, 0.2) !important;
        }
        @keyframes pulseSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        @keyframes backgroundDrift { to { background-position: -550px 0, -310px 60px, -120px 270px; } }
        .timer-ring { stroke-dasharray: 653; transition: stroke-dashoffset 1s linear, stroke 0.3s ease; }
        .bomb-pulse { animation: bombPulse 1.5s infinite alternate; }
        @keyframes bombPulse { to { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(255, 77, 0, 0.9)); } }
        .bomb-shake { animation: shake 0.3s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            50% { transform: translate(-2px, -1px) rotate(-2deg); }
            100% { transform: translate(2px, -2px) rotate(2deg); }
        }
        .fuse-spark {
            width: 8px; height: 8px; background-color: #FFB800; border-radius: 50%;
            position: absolute; top: 15%; right: 25%;
            box-shadow: 0 0 10px #FFB800, 0 0 20px #FF4D00; animation: sparkFlicker 0.1s infinite alternate;
        }
        @keyframes sparkFlicker { to { transform: scale(1.5) translate(2px, -2px); opacity: 0.8; } }
    </style>
</head>
<body class="text-textMain font-body min-h-screen flex flex-col items-center justify-center p-4 overflow-x-hidden relative">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <div id="screen-lobby" class="w-full max-w-sm bg-surface/90 p-8 rounded-2xl border border-surfaceElevated shadow-2xl backdrop-blur-md">
        <div class="text-center mb-6">
            <h1 class="font-display font-extrabold text-5xl text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">WORDBOMB</h1>
            <p class="font-mono text-secondary text-sm tracking-[0.2em]">CHAIN PROTOCOL</p>
        </div>
        <div class="space-y-4">
            <div>
                <input type="text" id="username-input" autocomplete="off" class="w-full bg-surfaceElevated border border-surfaceElevated focus:border-primary text-textMain px-4 py-3 rounded-lg outline-none font-mono text-center uppercase" placeholder="ENTER NICKNAME">
            </div>
            <button id="btn-create-room" class="w-full bg-primary hover:bg-[#E64500] text-textMain font-display font-bold text-xl py-3 rounded-lg shadow-neon-primary transition-all active:scale-95">CREATE ROOM</button>
            <div class="flex gap-2">
                <input type="text" id="room-id-input" autocomplete="off" class="w-2/3 bg-bgDark border border-surfaceElevated text-textMain px-4 py-3 rounded-lg outline-none font-mono text-sm text-center uppercase" placeholder="ROOM CODE">
                <button id="btn-join-room" class="w-1/3 bg-surfaceElevated hover:bg-surface text-textMain font-display font-bold text-lg rounded-lg border border-surfaceElevated hover:border-primary">JOIN</button>
            </div>
        </div>
    </div>

    <div id="screen-waiting" class="hidden w-full max-w-md bg-surface/90 p-8 rounded-2xl border border-surfaceElevated shadow-2xl backdrop-blur-md">
        <div class="text-center mb-6">
            <h2 class="text-sm text-textMuted uppercase tracking-[0.2em]">Access Code</h2>
            <p id="display-room-id" class="text-5xl font-mono font-black text-secondary tracking-widest mt-1">-----</p>
        </div>
        <div class="space-y-2 mb-6">
            <h3 class="text-xs font-semibold text-textMuted uppercase tracking-wider">Operatives (<span id="player-count">0</span>/10):</h3>
            <ul id="player-list" class="grid grid-cols-2 gap-2 bg-bgDark p-4 rounded-lg border border-surfaceElevated min-h-[120px] font-mono text-xs">
                </ul>
        </div>
        <button id="btn-start-game" class="hidden w-full bg-success hover:bg-[#00c58a] text-bgDark font-display font-bold text-xl py-3 rounded-lg shadow-neon-success transition-all active:scale-95">START MATCH</button>
        <p id="host-wait-msg" class="text-xs text-center text-textMuted font-mono animate-pulse">Awaiting Host Authorization...</p>
    </div>

    <div id="screen-game" class="hidden w-full max-w-4xl bg-surface/90 backdrop-blur-md rounded-2xl border border-surfaceElevated shadow-2xl p-6 flex-col gap-6">
        <div class="flex justify-between items-center bg-bgDark/50 p-3 rounded-xl border border-surfaceElevated">
            <div>
                <span class="block text-[10px] text-textMuted font-bold tracking-widest">TURN</span>
                <span id="current-player-name" class="font-display text-xl text-primary font-bold">...</span>
            </div>
            <div class="text-center hidden md:block">
                <span class="block text-[10px] text-textMuted font-bold tracking-widest">DIFFICULTY LEVEL</span>
                <span id="difficulty-level" class="font-mono text-sm text-success font-bold">1 (NORMAL)</span>
            </div>
            <div class="text-right">
                <span class="block text-[10px] text-textMuted font-bold tracking-widest">WORD COUNT</span>
                <span id="turn-count-display" class="font-mono text-lg text-secondary font-bold">0</span>
            </div>
        </div>

        <div class="relative flex justify-center items-center py-4">
            <svg class="w-48 h-48 md:w-56 md:h-56 transform -rotate-90 drop-shadow-2xl">
                <circle cx="50%" cy="50%" r="45%" stroke="#1C1C3A" stroke-width="8" fill="none" />
                <circle id="timer-circle" cx="50%" cy="50%" r="45%" stroke="#FF4D00" stroke-width="8" fill="none" stroke-linecap="round" class="timer-ring shadow-neon-primary" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div id="bomb-graphic" class="relative bomb-pulse">
                    <span class="text-6xl md:text-7xl">💣</span>
                    <div id="fuse-graphic" class="fuse-spark"></div>
                </div>
                <div id="countdown-text" class="font-mono text-3xl md:text-4xl font-bold mt-2 text-primary drop-shadow-md">20.0</div>
            </div>
        </div>

        <div class="text-center">
            <p class="text-xs text-textMuted uppercase tracking-[0.2em] mb-1">Must Start With</p>
            <div class="inline-block bg-bgDark border-2 border-secondary px-6 py-2 rounded-lg shadow-[0_0_10px_rgba(255,184,0,0.3)]">
                <span id="target-prefix" class="font-display font-bold text-4xl text-secondary">?</span>
            </div>
        </div>

        <form id="word-form" onsubmit="return false;" class="relative max-w-lg mx-auto w-full">
            <input type="text" id="game-input" disabled class="w-full bg-bgDark border-2 border-surfaceElevated focus:border-primary text-center text-textMain text-2xl md:text-3xl font-display font-bold px-4 md:px-6 py-3 md:py-4 rounded-xl outline-none uppercase transition-colors shadow-inner disabled:opacity-50" placeholder="WAITING..." autocomplete="off">
        </form>

        <div id="game-players-grid" class="flex flex-wrap justify-center gap-3 mt-2">
            </div>
    </div>

    <div id="screen-leaderboard" class="hidden w-full max-w-md bg-surface/90 p-8 rounded-2xl border border-surfaceElevated shadow-2xl backdrop-blur-md flex flex-col gap-6 text-center">
        <div>
            <h1 class="font-display font-extrabold text-4xl text-success shadow-neon-success drop-shadow-lg">MISSION OVER</h1>
            <p class="text-sm text-textMuted mt-1">Total Words Chained: <span id="final-word-count" class="font-bold text-secondary">0</span></p>
        </div>
        
        <div class="bg-bgDark border border-surfaceElevated rounded-xl p-4">
            <h2 class="text-[10px] text-textMuted font-bold tracking-widest mb-3">LAST MAN STANDING</h2>
            <div id="winner-display" class="font-display text-3xl font-bold text-primary mb-4">🏆 ...</div>
            <ul id="leaderboard-list" class="space-y-2 text-sm font-mono text-left max-h-[200px] overflow-y-auto pr-2">
                </ul>
        </div>

        <div class="pt-4 border-t border-surfaceElevated flex flex-col gap-3">
            <button id="btn-play-again" class="hidden w-full bg-secondary hover:bg-amber-400 text-bgDark font-display font-bold text-lg py-3 rounded-lg transition-all active:scale-95">REPLAY MISSION (HOST)</button>
            <p id="leaderboard-wait-msg" class="text-xs text-textMuted animate-pulse">Waiting for host to replay or exit...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABIg6BCF3FjA4XtNNoEXTbZgSSMp3SRXM",
            authDomain: "sistemirigasi.firebaseapp.com",
            databaseURL: "https://sistemirigasi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sistemirigasi",
            storageBucket: "sistemirigasi.firebasestorage.app",
            messagingSenderId: "8747183066",
            appId: "1:8747183066:web:ee905439df0b00b366eee3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Utama
        let myId = 'p_' + Math.random().toString(36).substring(2, 9);
        let myName = '';
        let currentRoomId = '';
        let isHost = false;
        let roomData = null;
        let localTimerInterval = null;
        let currentBaseTime = 20; 
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        const screens = {
            lobby: document.getElementById('screen-lobby'),
            waiting: document.getElementById('screen-waiting'),
            game: document.getElementById('screen-game'),
            leaderboard: document.getElementById('screen-leaderboard')
        };

        function switchScreen(screenKey) {
            Object.values(screens).forEach(s => {
                s.classList.add('hidden'); s.classList.remove('flex');
            });
            screens[screenKey].classList.remove('hidden');
            if(['game', 'leaderboard'].includes(screenKey)) screens[screenKey].classList.add('flex');
        }

        // Custom Toast System
        function showCustomToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const styles = {
                success: 'bg-success/20 border-success text-success shadow-[0_0_15px_rgba(0,229,160,0.3)]',
                error: 'bg-danger/20 border-danger text-danger shadow-[0_0_15px_rgba(255,45,85,0.3)]',
                info: 'bg-secondary/20 border-secondary text-secondary shadow-[0_0_15px_rgba(255,184,0,0.3)]',
                warning: 'bg-primary/20 border-primary text-primary shadow-[0_0_15px_rgba(255,77,0,0.3)]'
            };
            toast.className = `flex items-center gap-3 px-5 py-3 rounded-lg border backdrop-blur-md transform transition-all duration-300 translate-x-full opacity-0 ${styles[type]}`;
            toast.innerHTML = `<span class="font-display font-bold text-sm tracking-wide uppercase">${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // LOBBY LOGIC
        function setupUser() {
            const input = document.getElementById('username-input').value.trim();
            if(!input) { showCustomToast('Callsign required!', 'error'); return false; }
            myName = input;
            return true;
        }

        document.getElementById('btn-create-room').addEventListener('click', () => {
            if(!setupUser()) return;
            isHost = true;
            currentRoomId = Math.random().toString(36).substring(2, 7).toUpperCase();
            
            const roomRef = ref(db, `rooms/${currentRoomId}`);
            set(roomRef, {
                status: 'waiting_players',
                current_turn: myId,
                current_prefix: alphabet[Math.floor(Math.random() * alphabet.length)],
                bomb_timer: 20, turn_count: 0, winner: '',
                players: { [myId]: { name: myName, lives: 2, is_host: true, order: 0 } }
            }).then(() => {
                listenToRoom(); switchScreen('waiting');
            });
        });

        document.getElementById('btn-join-room').addEventListener('click', () => {
            if(!setupUser()) return;
            const inputCode = document.getElementById('room-id-input').value.toUpperCase().trim();
            if(!inputCode) return;

            currentRoomId = inputCode;
            runTransaction(ref(db, `rooms/${currentRoomId}`), (currentData) => {
                if (currentData) {
                    if (currentData.status !== 'waiting_players') return; 
                    const pCount = Object.keys(currentData.players || {}).length;
                    if (pCount >= 10) return; 
                    
                    if (!currentData.players) currentData.players = {};
                    currentData.players[myId] = { name: myName, lives: 2, is_host: false, order: pCount };
                }
                return currentData;
            }).then((result) => {
                if(result.committed && result.snapshot.val().status === 'waiting_players') {
                    listenToRoom(); switchScreen('waiting');
                } else {
                    showCustomToast('Room full or unavailable.', 'error');
                }
            });
        });

        // SYNC ROOM & ROUTING
        function listenToRoom() {
            onValue(ref(db, `rooms/${currentRoomId}`), (snapshot) => {
                roomData = snapshot.val();
                if(!roomData) return;

                if(roomData.status === 'waiting_players') {
                    clearInterval(localTimerInterval);
                    updateWaitingRoom();
                    switchScreen('waiting'); 
                } else if(roomData.status === 'playing') {
                    if(screens.game.classList.contains('hidden')) {
                        switchScreen('game'); showCustomToast('Game Started!', 'success');
                    }
                    renderGameplay();
                } else if(roomData.status === 'finished') {
                    clearInterval(localTimerInterval);
                    renderLeaderboard();
                    switchScreen('leaderboard');
                }
            });
        }

        function updateWaitingRoom() {
            document.getElementById('display-room-id').innerText = currentRoomId;
            const players = Object.values(roomData.players);
            document.getElementById('player-count').innerText = players.length;
            
            const listContainer = document.getElementById('player-list');
            listContainer.innerHTML = '';
            players.forEach(p => {
                const isMe = p.name === myName; // Use name to check if it's user
                listContainer.innerHTML += `<li class="text-textMain border-b border-surfaceElevated pb-1 truncate ${isMe ? 'text-primary font-bold' : ''}">
                    ${isMe ? '👉 ' : ''}${p.is_host ? '👑' : '👤'} ${p.name} ${isMe ? '(You)' : ''}
                </li>`;
            });

            if(isHost && players.length >= 2) { 
                document.getElementById('btn-start-game').classList.remove('hidden');
                document.getElementById('host-wait-msg').classList.add('hidden');
            }
        }

        document.getElementById('btn-start-game').addEventListener('click', () => {
            if(!isHost) return;
            update(ref(db, `rooms/${currentRoomId}`), { 
                status: 'playing', turn_count: 0, bomb_timer: 20 
            });
            startHostTimerLoop();
        });

        // CALCULATE ESCALATING DIFFICULTY
        function calculateDifficulty() {
            const turns = roomData.turn_count || 0;
            if (turns > 30) return { level: 3, time: 10, syllables: true, desc: "3 (INSANE)" };
            if (turns > 15) return { level: 2, time: 15, syllables: false, desc: "2 (HARD)" };
            return { level: 1, time: 20, syllables: false, desc: "1 (NORMAL)" };
        }

        // RENDER GAME
        function renderGameplay() {
            const difficulty = calculateDifficulty();
            currentBaseTime = difficulty.time;

            document.getElementById('target-prefix').innerText = roomData.current_prefix;
            document.getElementById('turn-count-display').innerText = roomData.turn_count || 0;
            
            const diffEl = document.getElementById('difficulty-level');
            diffEl.innerText = difficulty.desc;
            diffEl.className = `font-mono text-sm font-bold ${difficulty.level === 3 ? 'text-danger animate-pulse' : (difficulty.level === 2 ? 'text-secondary' : 'text-success')}`;

            // Timer & SVG UI
            const timerCircle = document.getElementById('timer-circle');
            const countdownText = document.getElementById('countdown-text');
            countdownText.innerText = roomData.bomb_timer;
            
            const circumference = 2 * Math.PI * 45; 
            timerCircle.style.strokeDashoffset = circumference - (roomData.bomb_timer / currentBaseTime) * circumference;

            if(roomData.bomb_timer <= 5) {
                timerCircle.style.stroke = '#FF2D55'; countdownText.style.color = '#FF2D55';
                document.getElementById('bomb-graphic').classList.add('bomb-shake');
            } else {
                timerCircle.style.stroke = '#FF4D00'; countdownText.style.color = '#FF4D00';
                document.getElementById('bomb-graphic').classList.remove('bomb-shake');
            }

            // Player Cards UI (Max 10)
            const playersArr = Object.entries(roomData.players).map(([id, p]) => ({id, ...p})).sort((a,b)=>a.order - b.order);
            const activePlayer = playersArr.find(p => p.id === roomData.current_turn);
            document.getElementById('current-player-name').innerText = activePlayer ? activePlayer.name : 'Unknown';

            const grid = document.getElementById('game-players-grid');
            grid.innerHTML = '';
            playersArr.forEach(p => {
                const isCurrent = p.id === roomData.current_turn;
                const isDead = p.lives <= 0;
                const isMe = p.id === myId;
                
                grid.innerHTML += `
                    <div class="rounded-lg p-2 text-center w-24 md:w-32 transition-all ${isCurrent ? 'bg-surfaceElevated border-2 border-primary shadow-neon-primary scale-105' : (isDead ? 'bg-bgDark border border-danger/30 opacity-40 grayscale' : 'bg-bgDark border border-surfaceElevated')}">
                        <div class="font-display font-bold text-xs truncate ${isDead ? 'text-danger line-through' : (isMe ? 'text-primary' : 'text-textMain')}">
                            ${isMe ? '👉 ' : ''}${p.name}
                        </div>
                        <div class="flex justify-center mt-1 text-[10px]">
                            ${Array(2).fill(0).map((_, i) => i < p.lives ? '❤️' : '🖤').join('')}
                        </div>
                    </div>
                `;
            });

            // Input Control
            const wordInput = document.getElementById('game-input');
            if(roomData.current_turn === myId && roomData.players[myId].lives > 0) {
                wordInput.removeAttribute('disabled');
                wordInput.placeholder = "YOUR TURN!";
                if(document.activeElement !== wordInput) wordInput.focus();
            } else {
                wordInput.setAttribute('disabled', 'true');
                wordInput.placeholder = roomData.players[myId]?.lives <= 0 ? "ELIMINATED" : "WAIT...";
                wordInput.value = '';
            }
        }
        // FUNGSI ANIMASI INPUT BOX
        function triggerInputAnim(type) {
            const inputField = document.getElementById('game-input');
            
            // Hapus class jika masih nyangkut
            inputField.classList.remove('input-error', 'input-success');
            
            // Trik "void offsetWidth" untuk mereset animasi (force reflow) agar bisa jalan berkali-kali
            void inputField.offsetWidth; 

            if (type === 'error') {
                inputField.classList.add('input-error');
                // Hapus class setelah animasi selesai (400ms)
                setTimeout(() => inputField.classList.remove('input-error'), 400);
            } else if (type === 'success') {
                inputField.classList.add('input-success');
                setTimeout(() => inputField.classList.remove('input-success'), 400);
            }
        }
        // CORE MECHANICS
        // CORE MECHANICS
        document.getElementById('word-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputField = document.getElementById('game-input');
            const word = inputField.value.toLowerCase().trim();
            const prefix = roomData.current_prefix.toLowerCase();

            if(!word) return;
            
            // VALIDASI LOKAL (ERROR)
            if(word.length < 3) {
                triggerInputAnim('error');
                showCustomToast("Too short! Min 3 letters.", 'warning');
                return;
            }
            if(!word.startsWith(prefix)) { 
                triggerInputAnim('error');
                showCustomToast(`Start with "${prefix.toUpperCase()}"!`, 'warning'); 
                return; 
            }
            if(roomData.used_words && roomData.used_words[word]) { 
                triggerInputAnim('error');
                showCustomToast("Word already used!", 'error'); 
                return; 
            }

            // Kunci input sementara nunggu API
            inputField.setAttribute('disabled', 'true');
            
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                
                if(res.status === 404) {
                    // SALAH (Kata tidak ada)
                    inputField.removeAttribute('disabled'); 
                    triggerInputAnim('error');
                    showCustomToast("Invalid English word!", 'error');
                    inputField.focus(); // Fokuskan kembali biar pemain bisa langsung hapus & ketik ulang
                } else if(res.ok) {
                    // BENAR
                    triggerInputAnim('success');
                    showCustomToast("Valid!", 'success');
                    
                    // Beri jeda 300ms biar efek hijaunya kelihatan sebelum input dikosongkan dan pindah turn
                    setTimeout(() => {
                        inputField.value = '';
                        passTurn(word);
                    }, 300);
                }
            } catch(err) {
                inputField.removeAttribute('disabled');
                triggerInputAnim('error');
                showCustomToast("API Network Error.", 'error'); 
            }
        });

        function getNextPrefix(word, difficulty) {
            let nextPrefix = word.slice(-1).toUpperCase(); 
            
            if (difficulty.syllables && word.length >= 3) {
                const twoLetters = word.slice(-2).toUpperCase();
                const invalidCombos = /^(Q|X|Z|J|V|CK|NG|NT|ND|MP|MB|RK|LT|RT)/;
                const hasVowel = /[AEIOUY]/.test(twoLetters);
                const isCommonBlend = /^(ST|CH|SH|TH|PR|BR|TR|CR|FR|GR|PL|BL|CL|FL|GL|SL|SP|SW|SM|SN|SC|SK)/.test(twoLetters);

                if ((hasVowel || isCommonBlend) && !invalidCombos.test(twoLetters)) {
                    nextPrefix = twoLetters;
                }
            }

            if (['X', 'Z', 'Q', 'Y'].includes(nextPrefix)) {
                nextPrefix = alphabet[Math.floor(Math.random() * alphabet.length)];
            }
            
            return nextPrefix;
        }

        function passTurn(validWord) {
            const playersArr = Object.entries(roomData.players).map(([id, p]) => ({id, ...p})).sort((a,b)=>a.order - b.order);
            const myIndex = playersArr.findIndex(p => p.id === myId);
            
            let nextIndex = (myIndex + 1) % playersArr.length;
            while(playersArr[nextIndex].lives <= 0 && nextIndex !== myIndex) {
                nextIndex = (nextIndex + 1) % playersArr.length;
            }

            const currentTurnCount = (roomData.turn_count || 0) + 1;
            const difficulty = calculateDifficulty(); 
            const nextPrefix = getNextPrefix(validWord, difficulty);

            const updates = {};
            updates[`rooms/${currentRoomId}/current_turn`] = playersArr[nextIndex].id;
            updates[`rooms/${currentRoomId}/current_prefix`] = nextPrefix;
            updates[`rooms/${currentRoomId}/bomb_timer`] = difficulty.time; 
            updates[`rooms/${currentRoomId}/turn_count`] = currentTurnCount;
            updates[`rooms/${currentRoomId}/used_words/${validWord}`] = true;

            update(ref(db), updates);
        }

        // HOST TIMER & EXPLOSION HANDLER
        function startHostTimerLoop() {
            if(!isHost) return;
            
            localTimerInterval = setInterval(() => {
                if(!roomData || roomData.status !== 'playing') return;

                if(roomData.bomb_timer > 0) {
                    update(ref(db, `rooms/${currentRoomId}`), { bomb_timer: roomData.bomb_timer - 1 });
                } else {
                    handleBombExplode();
                }
            }, 1000);
        }

        function handleBombExplode() {
            const targetPlayerId = roomData.current_turn;
            const currentLives = roomData.players[targetPlayerId].lives;
            const newLives = currentLives - 1;

            const updates = {};
            updates[`rooms/${currentRoomId}/players/${targetPlayerId}/lives`] = newLives;

            const difficulty = calculateDifficulty();
            updates[`rooms/${currentRoomId}/bomb_timer`] = difficulty.time; 

            const playersArr = Object.entries(roomData.players).map(([id, p]) => ({id, ...p})).sort((a,b)=>a.order - b.order);
            const alivePlayers = playersArr.filter(p => p.id === targetPlayerId ? newLives > 0 : p.lives > 0);
            
            if(alivePlayers.length <= 1) {
                updates[`rooms/${currentRoomId}/status`] = 'finished';
                updates[`rooms/${currentRoomId}/winner`] = alivePlayers[0] ? alivePlayers[0].name : 'NOBODY';
                update(ref(db), updates);
                return;
            }

            const currentIndex = playersArr.findIndex(p => p.id === targetPlayerId);
            let nextIndex = (currentIndex + 1) % playersArr.length;
            while((playersArr[nextIndex].id === targetPlayerId ? newLives <= 0 : playersArr[nextIndex].lives <= 0)) {
                nextIndex = (nextIndex + 1) % playersArr.length;
            }

            updates[`rooms/${currentRoomId}/current_turn`] = playersArr[nextIndex].id;
            updates[`rooms/${currentRoomId}/current_prefix`] = alphabet[Math.floor(Math.random() * alphabet.length)];
            update(ref(db), updates);
        }

        // LEADERBOARD LOGIC
        function renderLeaderboard() {
            document.getElementById('final-word-count').innerText = roomData.turn_count || 0;
            document.getElementById('winner-display').innerText = `🏆 ${roomData.winner}`;
            
            const playersArr = Object.values(roomData.players).sort((a,b) => b.lives - a.lives);
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            
            playersArr.forEach((p, idx) => {
                const isMe = p.name === myName;
                list.innerHTML += `<li class="flex justify-between items-center bg-surfaceElevated p-2 rounded border border-surfaceElevated ${p.lives > 0 ? 'text-textMain' : 'text-textMuted opacity-60'} ${isMe ? 'border-primary' : ''}">
                    <span class="${isMe ? 'text-primary font-bold' : ''}">${idx + 1}. ${isMe ? '👉 ' : ''}${p.name} ${isMe ? '(You)' : ''}</span>
                    <span>${p.lives > 0 ? '❤️ '.repeat(p.lives) : '💀 ELIMINATED'}</span>
                </li>`;
            });

            if(isHost) {
                document.getElementById('btn-play-again').classList.remove('hidden');
                document.getElementById('leaderboard-wait-msg').classList.add('hidden');
            }
        }

        document.getElementById('btn-play-again').addEventListener('click', () => {
            if(!isHost) return;
            const updates = {};
            updates[`rooms/${currentRoomId}/status`] = 'waiting_players';
            updates[`rooms/${currentRoomId}/used_words`] = null; 
            updates[`rooms/${currentRoomId}/turn_count`] = 0;
            updates[`rooms/${currentRoomId}/bomb_timer`] = 20;
            updates[`rooms/${currentRoomId}/current_prefix`] = alphabet[Math.floor(Math.random() * alphabet.length)];
            
            for(let pid in roomData.players) {
                updates[`rooms/${currentRoomId}/players/${pid}/lives`] = 2; 
            }
            update(ref(db), updates);
        });

    </script>
</body>
