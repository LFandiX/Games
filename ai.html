<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1c2026">
<title>Peacephile Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palet: abu kabut dingin + arang + tembaga kekuningan. Ganti warna cukup di blok ini. */
  :root{
    --bg:#eceef1;          /* latar halaman */
    --sheet:#fafbfc;       /* permukaan input & dialog */
    --ink:#14181f;         /* teks */
    --ink-soft:#586270;    /* teks sekunder */
    --rule:#d2d7de;        /* garis */
    --accent:#a8690f;      /* penanda & fokus */
    --head:#1c2026;        /* header */
    --tint:#f0e4cc;        /* pesan pengguna */
    --btn:#1c2026;         /* tombol utama */
    --btn-ink:#ffffff;
    --alert:#a3382c;
    --alert-tint:#f6e1de;
    --ok:#a8690f;
    --code:#1c2026;
    --code-ink:#e9ecf0;
    --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --serif:var(--sans);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#101215; --sheet:#181b20; --ink:#e8eaee; --ink-soft:#9199a6; --rule:#2a2f37;
      --accent:#e0a547; --head:#0b0c0e; --tint:#2d2719; --btn:#e0a547; --btn-ink:#14181f;
      --alert:#ef8c80; --alert-tint:#3b2220; --ok:#e0a547; --code:#0b0c0e;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);
       display:flex;flex-direction:column;height:100dvh;overflow:hidden}

  /* ---------- header ---------- */
  header{background:var(--head);color:#eef0f3;display:flex;align-items:center;gap:6px;
         padding:10px 8px 10px 18px;padding-top:calc(10px + env(safe-area-inset-top))}
  .brand{flex:1;min-width:0;line-height:1.25}
  .brand b{display:block;font:700 18px/1.2 var(--sans);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa2af}
  .led{width:7px;height:7px;border-radius:50%;background:#6c7480}
  .led.ok{background:#8ab4ff}.led.err{background:#ff8a80}
  header button{background:transparent;border:0;color:#c9ced6;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
  header button:hover{background:rgba(255,255,255,.09)}
  header svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- percakapan ---------- */
  #chat{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
        padding:20px max(16px,calc((100% - 740px)/2));display:flex;flex-direction:column;gap:20px}
  .msg{overflow-wrap:anywhere;word-wrap:break-word}
  .msg.user{align-self:flex-end;max-width:86%;background:var(--tint);padding:9px 14px;
            border-radius:14px 14px 3px 14px;white-space:pre-wrap}
  .msg.bot{align-self:stretch;border-left:2px solid var(--accent);padding:1px 0 1px 14px}
  .msg.error{align-self:stretch;border-left:2px solid var(--alert);background:var(--alert-tint);
             padding:10px 14px;font-size:14px;white-space:pre-wrap;border-radius:0 8px 8px 0}
  .msg pre{background:var(--code);color:var(--code-ink);border-radius:8px;padding:12px 14px;overflow-x:auto;
           margin:10px 0;font:13px/1.5 var(--mono);-webkit-overflow-scrolling:touch}
  .msg code{font-family:var(--mono);font-size:.88em}
  .msg :not(pre)>code{background:var(--tint);padding:1px 6px;border-radius:4px}

  .empty{margin:auto;max-width:320px;padding:0 8px;text-align:left}
  .empty h2{font:700 27px/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 8px}
  .empty p{margin:0;color:var(--ink-soft)}

  .typing{display:inline-flex;gap:5px;padding:6px 0}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:pulse 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes pulse{0%,70%,100%{opacity:.3}35%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.7}}

  /* ---------- input ---------- */
  form#composer{background:var(--bg);border-top:1px solid var(--rule);
                padding:10px max(12px,calc((100% - 740px)/2)) calc(10px + env(safe-area-inset-bottom));
                display:flex;align-items:flex-end;gap:8px}
  .field{flex:1;display:flex;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  textarea#input{flex:1;resize:none;max-height:150px;min-height:46px;background:transparent;color:var(--ink);
                 border:0;outline:0;padding:11px 14px;font:inherit}
  textarea#input::placeholder{color:var(--ink-soft)}
  #btnSend{width:46px;height:46px;flex:none;border:0;border-radius:10px;background:var(--btn);color:var(--btn-ink);
           display:grid;place-items:center;cursor:pointer}
  #btnSend:disabled{opacity:.45;cursor:default}
  #btnSend svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- pengaturan ---------- */
  dialog{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:12px;
         width:min(460px,94vw);padding:0;max-height:92dvh}
  dialog::backdrop{background:rgba(16,21,14,.6)}
  .dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
  .dlg h2{font:700 20px/1.2 var(--sans);letter-spacing:-.01em;margin:0}
  label{font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px}
  input[type=text],input[type=number],textarea.sys{background:var(--bg);color:var(--ink);border:1px solid var(--rule);
         border-radius:8px;padding:10px 12px;font:inherit;width:100%;min-height:44px}
  input:focus,textarea.sys:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .hint{font-size:13px;color:var(--ink-soft);margin:0}
  #status{font-size:13px;min-height:18px;word-break:break-word}
  .actions{display:flex;gap:8px;justify-content:flex-end}
  .actions button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--rule);
                  background:transparent;color:var(--ink);font:inherit;cursor:pointer}
  .actions button.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  @media (max-width:600px){
    dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border:0;border-radius:0}
    .dlg{min-height:100%;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
    .actions button{flex:1}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <b>Peacephile</b>
    <small><span class="led" id="led"></span><span id="ledText">Asisten siap</span></small>
  </div>
  <button id="btnClear" title="Hapus percakapan" aria-label="Hapus percakapan">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
  </button>
  <button id="btnSettings" title="Pengaturan" aria-label="Pengaturan">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="chat">
  <div class="empty" id="empty">
    <h2>Ada yang bisa dibantu?</h2>
    <p>Tulis pertanyaan atau tugasmu di kolom bawah.</p>
  </div>
</main>

<form id="composer">
  <div class="field">
    <textarea id="input" rows="1" placeholder="Tulis pesan" enterkeyhint="send" aria-label="Pesan"></textarea>
  </div>
  <button id="btnSend" type="submit" aria-label="Kirim">
    <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
</form>

<dialog id="dlg">
  <div class="dlg">
    <h2>Pengaturan</h2>
    <label>Alamat server
      <input type="text" id="proxyUrl" inputmode="url" autocapitalize="off" autocomplete="off">
    </label>
    <div class="row">
      <label>Panjang jawaban maks. <input type="number" id="maxTokens" inputmode="numeric" min="1"></label>
      <label>Riwayat dikirim <input type="number" id="historyLen" inputmode="numeric" min="1"></label>
    </div>
    <label>Instruksi tetap (opsional)
      <textarea class="sys" id="systemPrompt" rows="3" placeholder="Contoh: Jawab singkat dalam bahasa Indonesia."></textarea>
    </label>
    <p class="hint">Percakapan hanya tersimpan di perangkat ini.</p>
    <div id="status" role="status"></div>
    <div class="actions">
      <button id="btnTest" type="button">Tes koneksi</button>
      <button id="btnClose" type="button">Batal</button>
      <button id="btnSave" type="button" class="primary">Simpan</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ====== KONFIGURASI STATIS ======
  const DEFAULT_PROXY = 'https://curly-resonance-1cae.alfandiwijaya8.workers.dev';
  const FIXED_MODEL   = 'claude';   // id model pada MODELS di worker (dikunci)
  // =================================

  const FIELDS = ['proxyUrl','maxTokens','historyLen','systemPrompt'];
  const DEFAULTS = {proxyUrl:DEFAULT_PROXY,maxTokens:1024,historyLen:20,systemPrompt:''};
  let cfg = {...DEFAULTS};
  let history = [];
  let busy = false;
  const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;

  /* ---------- penyimpanan ---------- */
  const rd = (k, old) => { try{ return localStorage.getItem(k) ?? localStorage.getItem(old); }catch(e){ return null; } };
  function load(){
    try{ cfg = {...DEFAULTS, ...JSON.parse(rd('pp_cfg','sap_ai_cfg')||'{}')}; }catch(e){}
    if(!cfg.proxyUrl) cfg.proxyUrl = DEFAULT_PROXY;
    try{ history = JSON.parse(rd('pp_hist','sap_ai_hist')||'[]'); }catch(e){ history = []; }
  }
  function saveCfg(){ try{ localStorage.setItem('pp_cfg', JSON.stringify(cfg)); }catch(e){} }
  function saveHist(){ try{ localStorage.setItem('pp_hist', JSON.stringify(history.slice(-100))); }catch(e){} }

  /* ---------- pengaturan ---------- */
  function fillForm(){ FIELDS.forEach(f => { $(f).value = cfg[f] ?? ''; }); }
  function readForm(){
    FIELDS.forEach(f => { cfg[f] = $(f).value.trim(); });
    cfg.proxyUrl = cfg.proxyUrl || DEFAULT_PROXY;
    cfg.maxTokens = parseInt(cfg.maxTokens)||1024;
    cfg.historyLen = parseInt(cfg.historyLen)||20;
  }
  function setStatus(msg, ok){
    const s = $('status'); s.textContent = msg;
    s.style.color = ok===true?'var(--ok)':ok===false?'var(--alert)':'var(--ink-soft)';
  }
  function led(state, text){
    $('led').className = 'led ' + (state||'');
    $('ledText').textContent = text;
  }

  /* ---------- API ---------- */
  const trimSlash = s => s.replace(/\/+$/,'');
  async function callChat(messages){
    const res = await fetch(trimSlash(cfg.proxyUrl) + '/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages, max_completion_tokens: cfg.maxTokens, model: FIXED_MODEL })
    });
    if(!res.ok) throw new Error('Server menjawab dengan kode ' + res.status + '.\n' + (await res.text()).slice(0,400));
    const data = await res.json();
    const content = data?.choices?.[0]?.message?.content;
    if(content == null) throw new Error('Jawaban dari server tidak lengkap.\n' + JSON.stringify(data).slice(0,300));
    return content;
  }
  function buildMessages(){
    const msgs = [];
    if(cfg.systemPrompt) msgs.push({role:'system', content:cfg.systemPrompt});
    return msgs.concat(history.slice(-cfg.historyLen));
  }

  /* ---------- tampilan ---------- */
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function md(text){
    const blocks = [];
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,lang,code) => { blocks.push('<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>'); return '\u0000'+(blocks.length-1)+'\u0000'; });
    text = esc(text)
      .replace(/`([^`\n]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
      .replace(/(^|\n)#{1,3} ([^\n]+)/g,'$1<b>$2</b>')
      .replace(/(^|\n)[-*] /g,'$1• ')
      .replace(/\n/g,'<br>');
    return text.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
  }
  function scrollDown(){ const c=$('chat'); c.scrollTop = c.scrollHeight; }
  function addMsg(role, text){
    $('empty').style.display='none';
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    if(role==='bot') d.innerHTML = md(text); else d.textContent = text;
    $('chat').appendChild(d); scrollDown(); return d;
  }
  function renderAll(){
    $('chat').querySelectorAll('.msg').forEach(n=>n.remove());
    $('empty').style.display = history.length ? 'none' : '';
    history.forEach(m => addMsg(m.role==='assistant'?'bot':'user', m.content));
  }

  /* ---------- kirim ---------- */
  async function send(text){
    if(busy || !text.trim()) return;
    busy = true; $('btnSend').disabled = true;
    history.push({role:'user', content:text}); saveHist();
    addMsg('user', text);
    const pending = addMsg('bot','');
    pending.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    led('', 'Sedang menjawab');
    try{
      const reply = await callChat(buildMessages());
      pending.innerHTML = md(reply);
      history.push({role:'assistant', content:reply}); saveHist();
      led('ok', 'Asisten siap');
    }catch(err){
      pending.remove();
      history.pop(); saveHist();
      let m = err.message || String(err);
      if(/Failed to fetch|NetworkError|Load failed/i.test(m)) m = 'Server tidak bisa dihubungi. Periksa koneksi internet, lalu coba kirim lagi.';
      addMsg('error', m);
      led('err', 'Gagal terhubung');
    }finally{
      busy = false; $('btnSend').disabled = false; scrollDown();
      if(!coarse) $('input').focus();
    }
  }

  /* ---------- event ---------- */
  function autosize(){ const t=$('input'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,150)+'px'; }
  $('composer').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('input').value; $('input').value=''; autosize(); send(v);
  });
  // Desktop: Enter mengirim, Shift+Enter baris baru. HP: Enter baris baru, kirim lewat tombol.
  $('input').addEventListener('keydown', e => {
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing && !coarse){ e.preventDefault(); $('composer').requestSubmit(); }
  });
  $('input').addEventListener('input', autosize);
  $('input').addEventListener('focus', () => setTimeout(scrollDown, 300));

  $('btnSettings').onclick = () => { fillForm(); setStatus(''); $('dlg').showModal(); };
  $('btnClose').onclick = () => $('dlg').close();
  $('btnSave').onclick = () => { readForm(); saveCfg(); $('dlg').close(); };
  $('btnTest').onclick = async () => {
    readForm(); setStatus('Menguji koneksi…');
    try{
      await callChat([{role:'user', content:'Balas dengan satu kata: OK'}]);
      setStatus('Terhubung.', true); led('ok','Asisten siap');
    }catch(e){ setStatus(e.message, false); led('err','Gagal terhubung'); }
  };
  $('btnClear').onclick = () => {
    if(!history.length) return;
    if(confirm('Hapus seluruh percakapan?')){ history=[]; saveHist(); renderAll(); }
  };

  /* ---------- mulai ---------- */
  load(); renderAll(); led('', 'Asisten siap');
})();
</script>
</body>
</html>
